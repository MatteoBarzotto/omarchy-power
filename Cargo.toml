[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Matteo Barzotto <kubson2413@gmail.com>"]
repository = "https://github.com/MatteoBarzotto/omarchy-power"
rust-version = "1.98"

[workspace.dependencies]
omarchy-power-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
