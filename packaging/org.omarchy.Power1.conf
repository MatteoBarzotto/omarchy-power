<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root runs the daemon. -->
  <policy user="root">
    <allow own="org.omarchy.Power1"/>
  </policy>

  <!-- Anyone may look. Changing anything is gated by polkit inside the daemon,
       not here: this file cannot tell an active local session from an ssh one. -->
  <policy context="default">
    <allow send_destination="org.omarchy.Power1"/>
  </policy>
</busconfig>
