name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # Each crate must also build on its own: a workspace build unifies
      # features, which can hide a dependency that a single crate is missing.
      - run: cargo check -p omarchy-power-core
      - run: cargo check -p omarchy-power
      - run: cargo check -p omarchy-powerd
