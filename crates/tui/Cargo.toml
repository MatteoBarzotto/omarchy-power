[package]
name = "omarchy-power"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TUI for laptop power profiles, fans and charge thresholds"

[[bin]]
name = "omarchy-power"
path = "src/main.rs"

[dependencies]
omarchy-power-core = { workspace = true, features = ["dbus"] }
anyhow = { workspace = true }
ratatui = "0.30.2"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "p2p"] }
